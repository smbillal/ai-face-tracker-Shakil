<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveVision AI Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg-dark: #030712; --panel-bg: #0b1329; --accent-cyan: #00f2fe; --border-color: #1e293b; --text-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-color); padding-bottom: 60px; }

        header { background: #050a18; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .brand-title { font-size: 16px; font-weight: bold; color: #fff; }
        .brand-title span { color: var(--accent-cyan); font-size: 11px; }

        .user-card { background: #064e3b; color: #34d399; border: 1px solid #059669; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .toolbar { background: #070f23; padding: 8px 15px; display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--border-color); }
        .ctrl-btn { background: #111c35; color: var(--accent-cyan); border: 1px solid #1e293b; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }

        .main-container { padding: 10px; }
        .camera-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
        @media (max-width: 768px) { .camera-grid { grid-template-columns: 1fr; } }

        .cam-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; min-height: 200px; display: flex; flex-direction: column; }
        .cam-header { background: #070e20; padding: 6px 10px; display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid var(--border-color); }
        .badge-status { font-size: 9px; padding: 2px 6px; border-radius: 2px; font-weight: bold; }
        .badge-offline { background: #991b1b; color: #fca5a5; }
        .badge-online { background: #065f46; color: #a7f3d0; }

        .video-wrapper { position: relative; width: 100%; height: 160px; background: #000; display: flex; align-items: center; justify-content: center; }
        .video-wrapper video, .video-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .cam-placeholder { position: absolute; text-align: center; color: #64748b; font-size: 11px; }

        .cam-control-bar { background: #060c1c; padding: 6px; display: flex; border-top: 1px solid var(--border-color); }
        .cam-select { background: #0f172a; color: var(--accent-cyan); border: 1px solid #1e293b; font-size: 11px; padding: 4px; border-radius: 3px; width: 100%; }

        #map { width: 100%; height: 120px; border-radius: 4px; }
        footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #020610; border-top: 1px solid var(--accent-cyan); padding: 6px; text-align: center; font-size: 11px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 15px; }
        .modal-body { background: var(--panel-bg); border: 1px solid var(--accent-cyan); padding: 15px; border-radius: 6px; max-width: 400px; width: 100%; }
        .form-group { margin-bottom: 10px; }
        .form-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; }
        .form-group input { width: 100%; padding: 8px; background: #050a15; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">🛡️ DRIVEVISION <span>AI v18.0</span></div>
        <div id="userProfileBadge" class="user-card" onclick="openModal('authModal')">🔑 Guest Mode (Click to Login)</div>
    </header>

    <div class="toolbar">
        <button class="ctrl-btn" onclick="openModal('authModal')">👤 Account / Register</button>
        <button class="ctrl-btn" onclick="openModal('wifiCamModal')">📡 ActionCam WiFi Stream</button>
    </div>

    <div class="main-container">
        <div class="camera-grid">
            <div class="cam-card">
                <div class="cam-header">
                    <span>Front Cam</span>
                    <span id="badge1" class="badge-status badge-offline">OFFLINE</span>
                </div>
                <div class="video-wrapper">
                    <div class="cam-placeholder" id="ph1">📷 NO CAMERA CONNECTED</div>
                    <video id="video1" autoplay playsinline muted style="display:none;"></video>
                    <img id="img1" style="display:none;" />
                </div>
                <div class="cam-control-bar">
                    <select class="cam-select" onchange="handleCamSelect(1, this.value)">
                        <option value="none">-- Select Input --</option>
                        <option value="otg">🔌 Phone / USB Camera</option>
                        <option value="wificam">📡 WiFi ActionCam Stream</option>
                    </select>
                </div>
            </div>

            <div class="cam-card">
                <div class="cam-header">
                    <span>Rear Cam</span>
                    <span id="badge2" class="badge-status badge-offline">OFFLINE</span>
                </div>
                <div class="video-wrapper">
                    <div class="cam-placeholder" id="ph2">📷 NO CAMERA CONNECTED</div>
                    <video id="video2" autoplay playsinline muted style="display:none;"></video>
                    <img id="img2" style="display:none;" />
                </div>
                <div class="cam-control-bar">
                    <select class="cam-select" onchange="handleCamSelect(2, this.value)">
                        <option value="none">-- Select Input --</option>
                        <option value="otg">🔌 Phone / USB Camera</option>
                        <option value="wificam">📡 WiFi ActionCam Stream</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="background: var(--panel-bg); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">
            <div style="font-size: 12px; color: var(--accent-cyan); margin-bottom: 5px;">📍 GPS Location</div>
            <div id="map"></div>
        </div>
    </div>

    <!-- WiFi Action Camera Modal -->
    <div id="wifiCamModal" class="modal">
        <div class="modal-body">
            <h4 style="color: var(--accent-cyan); margin-bottom: 10px;">📡 ActionCam (ActionCam_341736cf1448)</h4>
            <div class="form-group">
                <label>Select Cam Slot:</label>
                <select id="targetCamSlot" style="width:100%; padding:8px; background:#050a15; color:#fff; border:1px solid #1e293b;">
                    <option value="1">Cam 1 (Front)</option>
                    <option value="2">Cam 2 (Rear)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Camera Stream URL / IP:</label>
                <input type="text" id="actionCamUrl" value="http://192.168.1.1:8080/?action=stream">
            </div>
            <button class="ctrl-btn" style="width: 100%; background: #0284c7; color:#fff;" onclick="connectWiFiActionCam()">Connect WiFi Stream</button>
            <button class="ctrl-btn" style="width: 100%; margin-top: 5px; background: #334155; color:#fff;" onclick="closeModal('wifiCamModal')">Close</button>
        </div>
    </div>

    <!-- Local Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-body">
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button class="ctrl-btn" style="flex:1" onclick="switchTab('login')">Login</button>
                <button class="ctrl-btn" style="flex:1" onclick="switchTab('reg')">Register</button>
            </div>

            <!-- Login -->
            <div id="loginForm">
                <div class="form-group"><label>Email:</label><input type="email" id="loginEmail"></div>
                <div class="form-group"><label>Password:</label><input type="password" id="loginPassword"></div>
                <button class="ctrl-btn" style="width: 100%; background:#0284c7; color:#fff;" onclick="executeLogin()">Login</button>
            </div>

            <!-- Registration -->
            <div id="regForm" style="display: none;">
                <div class="form-group"><label>Full Name:</label><input type="text" id="regName"></div>
                <div class="form-group"><label>Mobile:</label><input type="text" id="regMobile"></div>
                <div class="form-group"><label>Email:</label><input type="email" id="regEmail"></div>
                <div class="form-group"><label>Password:</label><input type="password" id="regPassword"></div>
                <button class="ctrl-btn" style="width: 100%; background: #10b981; color:#fff;" onclick="executeRegister()">Create Account (Auto 5-Digit ID)</button>
            </div>

            <button class="ctrl-btn" style="width: 100%; margin-top: 10px; background: #334155; color:#fff;" onclick="closeModal('authModal')">Close</button>
        </div>
    </div>

    <footer>
        Developer: <span style="color:var(--accent-cyan)">Mohammad Billal Hossain Shakil</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Check Active Session
        window.onload = function() {
            const map = L.map('map').setView([21.4858, 39.1925], 13);
            L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);

            const activeUser = JSON.parse(localStorage.getItem('activeUser'));
            if(activeUser) {
                document.getElementById('userProfileBadge').innerText = `👤 ${activeUser.name} (ID: ${activeUser.id})`;
            }
        };

        function generate5DigitID() { return Math.floor(10000 + Math.random() * 90000); }

        function executeRegister() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if(!name || !email || !password) { alert("সব তথ্য পূরণ করুন!"); return; }

            const uniqueID = generate5DigitID();
            const userData = { id: uniqueID, name: name, email: email, password: password };

            localStorage.setItem('user_' + email, JSON.stringify(userData));
            localStorage.setItem('activeUser', JSON.stringify(userData));

            alert(`রেজিস্ট্রেশন সফল হয়েছে!\nআপনার ইউনিক ইউজার আইডি: ${uniqueID}`);
            document.getElementById('userProfileBadge').innerText = `👤 ${name} (ID: ${uniqueID})`;
            closeModal('authModal');
        }

        function executeLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const storedUser = JSON.parse(localStorage.getItem('user_' + email));

            if(storedUser && storedUser.password === password) {
                localStorage.setItem('activeUser', JSON.stringify(storedUser));
                document.getElementById('userProfileBadge').innerText = `👤 ${storedUser.name} (ID: ${storedUser.id})`;
                alert("লগইন সফল হয়েছে!");
                closeModal('authModal');
            } else {
                alert("ইমেইল বা পাসওয়ার্ড সঠিক নয়!");
            }
        }

        function handleCamSelect(slot, type) {
            if (type === 'otg') connectOTGCam(slot);
            else if (type === 'wificam') {
                document.getElementById('targetCamSlot').value = slot;
                openModal('wifiCamModal');
            }
        }

        async function connectOTGCam(slot) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById(`video${slot}`);
                document.getElementById(`img${slot}`).style.display = 'none';
                video.style.display = 'block';
                video.srcObject = stream;
                document.getElementById(`ph${slot}`).style.display = 'none';
                document.getElementById(`badge${slot}`).className = 'badge-status badge-online';
                document.getElementById(`badge${slot}`).innerText = 'ONLINE (USB/OTG)';
            } catch (err) { alert("ক্যামেরা অন করা যায়নি: " + err.message); }
        }

        function connectWiFiActionCam() {
            const slot = document.getElementById('targetCamSlot').value;
            const url = document.getElementById('actionCamUrl').value;

            document.getElementById(`video${slot}`).style.display = 'none';
            const img = document.getElementById(`img${slot}`);
            img.style.display = 'block';
            img.src = url;

            document.getElementById(`ph${slot}`).style.display = 'none';
            document.getElementById(`badge${slot}`).className = 'badge-status badge-online';
            document.getElementById(`badge${slot}`).innerText = 'ONLINE (WiFi Stream)';
            closeModal('wifiCamModal');
        }

        function switchTab(t) {
            document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
            document.getElementById('regForm').style.display = t === 'reg' ? 'block' : 'none';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
    </html>
