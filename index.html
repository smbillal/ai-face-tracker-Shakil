<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber HUD v5.0 - Smart Automation Engine</title>
  <link rel="stylesheet" href="style.css?v=5.0">
  
  <!-- MediaPipe AI High-Speed Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Smooth Air-Touch Yellow Cursor -->
  <div id="yellowCursor"></div>

  <div class="cyber-container">
    
    <!-- TOP BOX: Smart Hub, Web Browser & Virtual Keyboard (Strict 50%) -->
    <div class="top-box cyber-card">
      
      <!-- Top Control Bar -->
      <div class="cyber-tools">
        <span class="tool-title">⚡ CYBER HUD v5.0</span>
        <div class="btn-group">
          <button class="cyber-btn" onclick="searchGoogle()">🔍 Google</button>
          <button class="cyber-btn" onclick="openYouTubeEmbed()">▶️ YouTube</button>
          <button class="cyber-btn voice-btn" onclick="startVoiceSearch()">🎙️ Voice</button>
          <button class="cyber-btn" onclick="showDevInfo()">👤 ডেভলপার</button>
        </div>
      </div>

      <!-- IoT Smart Home Control Panel (Commercial Feature) -->
      <div class="iot-panel">
        <button class="iot-btn" id="lightBtn" onclick="toggleIoT('light')">💡 Light: OFF</button>
        <button class="iot-btn" id="fanBtn" onclick="toggleIoT('fan')">🌀 Fan: OFF</button>
        <button class="iot-btn" id="acBtn" onclick="toggleIoT('ac')">❄️ AC: OFF</button>
      </div>

      <!-- Search Bar -->
      <div class="search-bar-container">
        <span class="search-icon">🔎</span>
        <input type="text" id="cyberInput" placeholder="কারসর আনলে কিবোর্ড বা ভয়েস বাটন চাপুন..." autocomplete="off" readonly>
        <button class="cyber-action-btn" onclick="searchGoogle()">Search</button>
      </div>

      <!-- Full A-Z Cyber Virtual Keyboard -->
      <div class="cyber-keyboard hidden" id="keyboard"></div>

      <!-- Browser / Embed Viewport -->
      <div class="viewport-container">
        <iframe id="browserFrame" class="cyber-iframe" src="about:blank"></iframe>
      </div>
    </div>

    <!-- BOTTOM BOX: Bounded Camera Window & System Metrics (Strict 50%) -->
    <div class="bottom-box cyber-card">
      <div class="video-container">
        <canvas id="matrixCanvas"></canvas>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        
        <!-- Live System Widgets Overlay -->
        <div class="widget-overlay top-left">
          <span id="timeWidget">⏱️ 00:00:00</span>
          <span id="batteryWidget">🔋 Battery: --%</span>
          <span id="fpsWidget">⚡ FPS: 60</span>
        </div>

        <div class="tracking-overlay bottom-left">
          <span class="pulse-text">🟡 AIR-TOUCH ACTIVE</span>
          <span id="gesture-status">তর্জনী দিয়ে কারসর | চিমটি দিয়ে সিলেক্ট</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Developer Profile Modal -->
  <div id="devModal" class="modal">
    <div class="modal-content cyber-card">
      <h2 class="cyber-title">⚡ CYBER HUD DEVELOPER ⚡</h2>
      <div class="dev-details">
        <p><strong>ডেভলপার:</strong> Mohammad Billal Hossain (Shakil)</p>
        <p><strong>প্রজেক্ট:</strong> IoT Commercial Gesture Hub v5.0</p>
        <p><strong>ইঞ্জিন:</strong> MediaPipe AI + Web IoT Engine</p>
      </div>
      <button class="cyber-btn close-btn" onclick="hideDevInfo()">[ X ] উইন্ডো বন্ধ করুন</button>
    </div>
  </div>

  <script src="script.js?v=5.0"></script>
</body>
</html>
