<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Gesture Browser & Code Studio - Mohammad Billal Hossain</title>
    <!-- MediaPipe & Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, monospace, sans-serif;
        }

        body {
            background-color: #03060f;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Container */
        .top-nav {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 950px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        /* Futuristic Google Search Bar */
        .search-bar-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(10, 18, 35, 0.75);
            border: 1.5px solid rgba(0, 243, 255, 0.4);
            border-radius: 30px;
            padding: 6px 16px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-bar-container:hover, .search-bar-container.active {
            border-color: #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Action Buttons */
        .nav-btn {
            background: rgba(255, 0, 85, 0.15);
            border: 1.5px solid #ff0055;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            white-space: nowrap;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .nav-btn:hover, .nav-btn.hover-active {
            background: #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
            transform: scale(1.05);
        }

        .nav-btn.blue-btn {
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .nav-btn.blue-btn:hover, .nav-btn.blue-btn.hover-active {
            background: #00f3ff;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        }

        /* Side Quick Clear (Close Object) Icon Button */
        .clear-screen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 0, 85, 0.25);
            border: 2px solid #ff0055;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1200;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .clear-screen-btn:hover, .clear-screen-btn.hover-active {
            background: #ff0055;
            box-shadow: 0 0 25px #ff0055;
            transform: scale(1.15) rotate(90deg);
        }

        /* Main Display Screen Setup */
        #app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Browser Frame (Top Half on Search) */
        #browser-view {
            width: 100%;
            height: 0%;
            background: #ffffff;
            border-bottom: 2px solid #00f3ff;
            transition: height 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: relative;
            z-index: 50;
        }

        #browser-view.active {
            height: 50vh;
        }

        #browser-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Camera & Tracking View */
        #camera-view {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #02040a;
        }

        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.85;
        }

        canvas#output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Floating Transparent Digital Keyboard */
        #virtual-keyboard {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px) scale(0.95);
            width: 92%;
            max-width: 850px;
            background: rgba(8, 14, 28, 0.35);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #virtual-keyboard.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 7px;
        }

        .key {
            flex: 1;
            min-width: 36px;
            height: 46px;
            background: rgba(0, 150, 255, 0.1);
            border: 1.5px solid #00f3ff;
            color: #00f3ff;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
            transition: all 0.15s ease;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .key:hover, .key.hover-active {
            background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 20px #00f3ff;
            color: #ffffff;
        }

        .key.red-key {
            background: rgba(255, 0, 85, 0.15);
            border-color: #ff0055;
            color: #ff0055;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }

        .key.red-key:hover, .key.red-key.hover-active {
            background: rgba(255, 0, 85, 0.5);
            box-shadow: 0 0 20px #ff0055;
            color: #ffffff;
        }

        .key.wide-key { flex: 2; }
        .key.space-key { flex: 4; }

        /* Owner Profile Card (Mohammad Billal Hossain) */
        #owner-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 18, 38, 0.92);
            border: 2px solid #00f3ff;
            border-radius: 20px;
            padding: 25px 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(20px);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #owner-card.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .owner-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: #ff0055;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .owner-name {
            font-size: 26px;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff;
            margin-bottom: 6px;
        }

        .owner-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Auto-Type Code Box Container */
        #code-studio-box {
            position: absolute;
            bottom: 65px;
            right: 25px;
            width: 420px;
            max-width: 90vw;
            height: 280px;
            background: rgba(5, 10, 22, 0.92);
            border: 1.5px solid #00f3ff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(15px);
            z-index: 1500;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        #code-studio-box.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 8px;
            margin-bottom: 8px;
            color: #00f3ff;
            font-size: 13px;
            font-weight: bold;
        }

        .code-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #00f3ff;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.7);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Cursor Laser Pointer */
        #ai-cursor {
            position: fixed;
            width: 26px;
            height: 26px;
            border: 2px solid #00f3ff;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.25);
            box-shadow: 0 0 15px #00f3ff, inset 0 0 10px #00f3ff;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
        }

        #ai-cursor.pinched {
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.6);
            box-shadow: 0 0 25px #ff0055;
            transform: translate(-50%, -50%) scale(0.8);
        }

        /* Screenshot Flash Effect */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.2s ease-out;
        }

        /* HUD Status Overlay */
        .hud-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 12px;
            color: #00f3ff;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            z-index: 800;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0055;
            box-shadow: 0 0 8px #ff0055;
        }

        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #code-studio-box {
                width: 90vw;
                right: 5%;
                bottom: 80px;
                height: 220px;
            }
            .owner-name { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- Flash Effect for Screenshot -->
    <div id="flash-overlay"></div>

    <div id="app-container">

        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="search-bar-container" id="search-box-trigger">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <input type="text" class="search-input" id="search-input" placeholder="পয়েন্ট করুন বা গুগলে সার্চ করতে লিখুন..." readonly>
            </div>
            
            <button class="nav-btn blue-btn" id="btn-toggle-kbd">⌨️ কিবোর্ড</button>
            <button class="nav-btn blue-btn" id="btn-code-box">💻 কোড ভিউ</button>
            <button class="nav-btn" id="btn-full-cam">🎥 ফুল ক্যামেরা</button>
        </div>

        <!-- Quick Clear / Close Screen Button -->
        <div class="clear-screen-btn" id="btn-clear-all" title="স্ক্রিন ক্লিয়ার করুন">✕</div>

        <!-- Real-time Web Browser Section (Top Half) -->
        <div id="browser-view">
            <iframe id="browser-iframe" src="about:blank"></iframe>
        </div>

        <!-- Camera Feed Area -->
        <div id="camera-view">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>

            <!-- Floating Digital Keyboard -->
            <div id="virtual-keyboard">
                <div class="keyboard-row">
                    <div class="key" data-key="1">1</div>
                    <div class="key" data-key="2">2</div>
                    <div class="key" data-key="3">3</div>
                    <div class="key" data-key="4">4</div>
                    <div class="key" data-key="5">5</div>
                    <div class="key" data-key="6">6</div>
                    <div class="key" data-key="7">7</div>
                    <div class="key" data-key="8">8</div>
                    <div class="key" data-key="9">9</div>
                    <div class="key" data-key="0">0</div>
                    <div class="key red-key wide-key" data-action="backspace">⌫ BACK</div>
                </div>
                <div class="keyboard-row">
                    <div class="key" data-key="Q">Q</div>
                    <div class="key" data-key="W">W</div>
                    <div class="key" data-key="E">E</div>
                    <div class="key" data-key="R">R</div>
                    <div class="key" data-key="T">T</div>
                    <div class="key" data-key="Y">Y</div>
                    <div class="key" data-key="U">U</div>
                    <div class="key" data-key="I">I</div>
                    <div class="key" data-key="O">O</div>
                    <div class="key" data-key="P">P</div>
                    <div class="key red-key" data-action="clear">✖ CLEAR</div>
                </div>
                <div class="keyboard-row">
                    <div class="key" data-key="A">A</div>
                    <div class="key" data-key="S">S</div>
                    <div class="key" data-key="D">D</div>
                    <div class="key" data-key="F">F</div>
                    <div class="key" data-key="G">G</div>
                    <div class="key" data-key="H">H</div>
                    <div class="key" data-key="J">J</div>
                    <div class="key" data-key="K">K</div>
                    <div class="key" data-key="L">L</div>
                    <div class="key wide-key" data-action="search" style="background: rgba(0,255,136,0.2); border-color: #00ff88; color:#00ff88;">🔍 SEARCH</div>
                </div>
                <div class="keyboard-row">
                    <div class="key" data-key="Z">Z</div>
                    <div class="key" data-key="X">X</div>
                    <div class="key" data-key="C">C</div>
                    <div class="key" data-key="V">V</div>
                    <div class="key" data-key="B">B</div>
                    <div class="key" data-key="N">N</div>
                    <div class="key" data-key="M">M</div>
                    <div class="key" data-key=".">.</div>
                    <div class="key space-key" data-action="space">SPACE</div>
                    <div class="key red-key" data-action="close">✕ HIDE</div>
                </div>
            </div>

            <!-- Owner Profile Card Popup -->
            <div id="owner-card">
                <div class="owner-title">⚡ Website Creator & Developer ⚡</div>
                <div class="owner-name">Mohammad Billal Hossain</div>
                <div class="owner-sub">AI & Computer Vision Gesture Interface</div>
            </div>

            <!-- Neon Blue Code Studio Box (Typewriter Effect) -->
            <div id="code-studio-box">
                <div class="code-header">
                    <span>💻 Source Code (HTML & JS)</span>
                    <span style="cursor:pointer;" onclick="hideCodeBox()">✕</span>
                </div>
                <div class="code-content" id="code-typewriter"></div>
            </div>

            <!-- HUD Overlay Status -->
            <div class="hud-status">
                <div class="status-dot" id="status-dot"></div>
                <span id="hud-text">ক্যামেরা কানেক্ট হচ্ছে...</span>
            </div>
        </div>

    </div>

    <!-- AI Laser Cursor -->
    <div id="ai-cursor"></div>

    <script>
        // DOM Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('ai-cursor');
        const searchInput = document.getElementById('search-input');
        const searchBoxTrigger = document.getElementById('search-box-trigger');
        const keyboard = document.getElementById('virtual-keyboard');
        const browserView = document.getElementById('browser-view');
        const browserIframe = document.getElementById('browser-iframe');
        const hudText = document.getElementById('hud-text');
        const statusDot = document.getElementById('status-dot');
        const ownerCard = document.getElementById('owner-card');
        const codeStudioBox = document.getElementById('code-studio-box');
        const codeTypewriter = document.getElementById('code-typewriter');
        const btnClearAll = document.getElementById('btn-clear-all');
        const btnFullCam = document.getElementById('btn-full-cam');
        const btnToggleKbd = document.getElementById('btn-toggle-kbd');
        const btnCodeBox = document.getElementById('btn-code-box');
        const flashOverlay = document.getElementById('flash-overlay');

        // High Speed Cursor Variables
        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        const SPEED_SENSITIVITY = 1.85; 
        const SMOOTHING_FACTOR = 0.65; 

        // Gesture States & Cooldowns
        let isPinching = false;
        let lastPinchTime = 0;
        let lastGestureTime = 0;
        const GESTURE_COOLDOWN = 2500; // 2.5 sec cooldown for gesture actions

        // Typewriter Code Snippet
        const sampleCodeSnippet = `<!-- AI Gesture Interface Engine -->
<script>
  const hands = new Hands({ locateFile: (f) => ... });
  hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.6 });
  
  // Custom Gesture Recognizers
  function detectGestures(landmarks) {
    // 4 Fingers: Take Screenshot
    if (isFourFingersOpen(landmarks)) captureScreen();
    // 1 Thumb: Creator Profile & Voice
    if (isThumbOnly(landmarks)) speakOwnerName();
  }
<\/script>
<style>
  #ai-cursor { border: 2px solid #00f3ff; box-shadow: 0 0 15px #00f3ff; }
</style>`;

        let typewriterIndex = 0;
        let typewriterInterval = null;

        // Sound & Speech Synthesis
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Auto Typewriter Code Stream Animation
        function startCodeTypewriter() {
            codeStudioBox.classList.add('active');
            if (typewriterInterval) clearInterval(typewriterInterval);
            codeTypewriter.innerText = '';
            typewriterIndex = 0;

            typewriterInterval = setInterval(() => {
                if (typewriterIndex < sampleCodeSnippet.length) {
                    codeTypewriter.innerText += sampleCodeSnippet.charAt(typewriterIndex);
                    typewriterIndex++;
                    codeTypewriter.scrollTop = codeTypewriter.scrollHeight;
                } else {
                    clearInterval(typewriterInterval);
                }
            }, 25);
        }

        function hideCodeBox() {
            codeStudioBox.classList.remove('active');
            if (typewriterInterval) clearInterval(typewriterInterval);
        }

        // Clear All Popups & Objects
        function clearAllScreenObjects() {
            browserView.classList.remove('active');
            browserIframe.src = "about:blank";
            keyboard.classList.remove('visible');
            ownerCard.classList.remove('active');
            hideCodeBox();
            hudText.innerText = "স্ক্রিন ক্লিয়ার করা হয়েছে!";
        }

        btnClearAll.addEventListener('click', clearAllScreenObjects);
        btnFullCam.addEventListener('click', clearAllScreenObjects);

        btnToggleKbd.addEventListener('click', () => {
            keyboard.classList.toggle('visible');
        });

        btnCodeBox.addEventListener('click', () => {
            if (codeStudioBox.classList.contains('active')) hideCodeBox();
            else startCodeTypewriter();
        });

        // Screenshot Feature (4 Fingers Gesture Trigger)
        function takeScreenShot() {
            hudText.innerText = "📸 স্ক্রিনশট নেওয়া হচ্ছে...";
            
            // Trigger Flash Animation
            flashOverlay.style.opacity = '0.9';
            setTimeout(() => flashOverlay.style.opacity = '0', 200);

            // Capture Screen Canvas
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'gesture-screenshot.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                hudText.innerText = "✅ স্ক্রিনশট নেওয়া সম্পন্ন হয়েছে!";
            }).catch(() => {
                hudText.innerText = "❌ স্ক্রিনশট নিতে সমস্যা হয়েছে";
            });
        }

        // Show Owner Profile & Voice Speak (1 Thumb Gesture Trigger)
        function showOwnerProfile() {
            ownerCard.classList.add('active');
            hudText.innerText = "👤 ডেভেলপার প্রোফাইল: Mohammad Billal Hossain";
            
            // Play Audio Text to Speech in English
            speakText("This site was created by Mohammad Billal Hossain");

            // Auto hide profile card after 5 seconds
            setTimeout(() => {
                ownerCard.classList.remove('active');
            }, 5000);
        }

        // Perform Google/Web Search
        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            hudText.innerText = "সার্চ করা হচ্ছে: " + query;
            let targetUrl = query;
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (query.includes('.') && !query.includes(' ')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                }
            }
            browserIframe.src = targetUrl;
            browserView.classList.add('active');
            keyboard.classList.remove('visible');
        }

        // Keyboard Action Processing
        function handleKeyPress(keyElement) {
            const char = keyElement.getAttribute('data-key');
            const action = keyElement.getAttribute('data-action');

            if (char) searchInput.value += char;
            else if (action === 'backspace') searchInput.value = searchInput.value.slice(0, -1);
            else if (action === 'clear') searchInput.value = '';
            else if (action === 'space') searchInput.value += ' ';
            else if (action === 'search') performSearch();
            else if (action === 'close') keyboard.classList.remove('visible');

            keyElement.classList.add('hover-active');
            setTimeout(() => keyElement.classList.remove('hover-active'), 200);
        }

        // Cursor & Object Hover Interactivity
        function interactAtCursor(x, y, triggerClick) {
            cursor.style.left = `${x}px`;
            cursor.style.top = `${y}px`;

            // Hover trigger on search bar to show keyboard
            const searchRect = searchBoxTrigger.getBoundingClientRect();
            if (x >= searchRect.left && x <= searchRect.right && y >= searchRect.top && y <= searchRect.bottom) {
                keyboard.classList.add('visible');
            }

            // Detect Hover on Clear Screen Button (Automatic Screen Clear)
            const clearRect = btnClearAll.getBoundingClientRect();
            if (x >= clearRect.left && x <= clearRect.right && y >= clearRect.top && y <= clearRect.bottom) {
                btnClearAll.classList.add('hover-active');
                if (triggerClick) clearAllScreenObjects();
            } else {
                btnClearAll.classList.remove('hover-active');
            }

            cursor.style.display = 'none';
            const targetEl = document.elementFromPoint(x, y);
            cursor.style.display = 'block';

            document.querySelectorAll('.key, .nav-btn').forEach(el => el.classList.remove('hover-active'));

            if (targetEl) {
                const keyEl = targetEl.closest('.key');
                const btnEl = targetEl.closest('.nav-btn');

                if (keyEl) keyEl.classList.add('hover-active');
                if (btnEl) btnEl.classList.add('hover-active');

                if (triggerClick) {
                    if (keyEl) handleKeyPress(keyEl);
                    else if (btnEl === btnFullCam) clearAllScreenObjects();
                    else if (btnEl === btnToggleKbd) keyboard.classList.toggle('visible');
                    else if (btnEl === btnCodeBox) {
                        if (codeStudioBox.classList.contains('active')) hideCodeBox();
                        else startCodeTypewriter();
                    }
                }
            }
        }

        // Hand Gesture Detection Engine
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDot.classList.add('active');
                const landmarks = results.multiHandLandmarks[0];

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;

                // High Speed Smooth Pointer Calculation
                const rawMappedX = (1 - indexTip.x) * screenW;
                const rawMappedY = indexTip.y * screenH;
                const centerX = screenW / 2;
                const centerY = screenH / 2;

                const targetX = centerX + (rawMappedX - centerX) * SPEED_SENSITIVITY;
                const targetY = centerY + (rawMappedY - centerY) * SPEED_SENSITIVITY;

                cursorX = cursorX + (targetX - cursorX) * SMOOTHING_FACTOR;
                cursorY = cursorY + (targetY - cursorY) * SMOOTHING_FACTOR;

                cursorX = Math.max(10, Math.min(screenW - 10, cursorX));
                cursorY = Math.max(10, Math.min(screenH - 10, cursorY));

                // Finger Extension Test State
                const indexOpen = landmarks[8].y < landmarks[6].y;
                const middleOpen = landmarks[12].y < landmarks[10].y;
                const ringOpen = landmarks[16].y < landmarks[14].y;
                const pinkyOpen = landmarks[20].y < landmarks[18].y;
                const thumbOpen = Math.abs(landmarks[4].x - landmarks[2].x) > 0.05;

                const now = Date.now();

                // Gesture 1: 4 Fingers Open (Index, Middle, Ring, Pinky open & Thumb folded) -> SCREENSHOT
                if (indexOpen && middleOpen && ringOpen && pinkyOpen && !thumbOpen) {
                    if (now - lastGestureTime > GESTURE_COOLDOWN) {
                        lastGestureTime = now;
                        takeScreenShot();
                    }
                }

                // Gesture 2: 1 Thumb Only (Thumb open/up, Index, Middle, Ring, Pinky folded) -> OWNER NAME & SPEECH
                if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen && (landmarks[4].y < landmarks[3].y)) {
                    if (now - lastGestureTime > GESTURE_COOLDOWN) {
                        lastGestureTime = now;
                        showOwnerProfile();
                    }
                }

                // Pinch Gesture (Click)
                const distance = Math.hypot(
                    (indexTip.x - thumbTip.x) * screenW,
                    (indexTip.y - thumbTip.y) * screenH
                );

                let triggerPinch = false;
                if (distance < 40) {
                    cursor.classList.add('pinched');
                    if (!isPinching && (now - lastPinchTime > 280)) {
                        isPinching = true;
                        triggerPinch = true;
                        lastPinchTime = now;
                    }
                } else {
                    cursor.classList.remove('pinched');
                    isPinching = false;
                }

                interactAtCursor(cursorX, cursorY, triggerPinch);

                // Draw Trackers on Canvas
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 243, 255, 0.4)', lineWidth: 2});
                drawLandmarks(canvasCtx, [landmarks[8], landmarks[4]], {color: '#ff0055', lineWidth: 3, radius: 4});

            } else {
                statusDot.classList.remove('active');
                hudText.innerText = "ক্যামেরার সামনে হাত রাখুন...";
            }
            canvasCtx.restore();
        }

        // Initialize MediaPipe Engine
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            hudText.innerText = "ক্যামেরা প্রস্তুত! হাত তুলে ট্র্যাকিং শুরু করুন।";
        });

        // Touch & Mouse Fallback
        window.addEventListener('mousemove', (e) => {
            if (!statusDot.classList.contains('active')) interactAtCursor(e.clientX, e.clientY, false);
        });

        window.addEventListener('click', (e) => {
            if (!statusDot.classList.contains('active')) interactAtCursor(e.clientX, e.clientY, true);
        });
    </script>
</body>
    </html>
