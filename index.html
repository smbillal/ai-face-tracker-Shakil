<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber HUD v4.0 - Ultra Engine</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- MediaPipe High Performance Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Smooth Yellow Air Cursor -->
  <div id="yellowCursor"></div>

  <div class="cyber-container">
    
    <!-- TOP BOX: Search, Keyboard & Google/YouTube Display (Equal Height 50%) -->
    <div class="top-box cyber-card">
      <div class="cyber-tools">
        <span class="tool-title">⚡ CYBER HUD v4.0</span>
        <div class="btn-group">
          <button class="cyber-btn" onclick="searchGoogle()">🔍 Google</button>
          <button class="cyber-btn" onclick="openYouTubeEmbed()">▶️ YouTube</button>
          <button class="cyber-btn" onclick="showDevInfo()">👤 ডেভলপার</button>
        </div>
      </div>

      <!-- Google Style Compact Search Bar -->
      <div class="search-bar-container">
        <span class="search-icon">🔎</span>
        <input type="text" id="cyberInput" placeholder="এখানে কারসর আনলে কিবোর্ড ওপেন হবে..." autocomplete="off" readonly>
        <button class="cyber-action-btn" onclick="executeGoogleSearch()">Search</button>
      </div>

      <!-- Full A-Z Cyber Virtual Keyboard -->
      <div class="cyber-keyboard hidden" id="keyboard"></div>

      <!-- Cyber Web Display Frame -->
      <div class="viewport-container">
        <iframe id="browserFrame" class="cyber-iframe" src="about:blank"></iframe>
      </div>
    </div>

    <!-- BOTTOM BOX: Face HUD & Camera Bounded Container (Equal Height 50%) -->
    <div class="bottom-box cyber-card">
      <div class="video-container">
        <canvas id="matrixCanvas"></canvas>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="tracking-overlay">
          <span class="pulse-text">🟡 SMOOTH AIR-CURSOR ACTIVE</span>
          <span id="gesture-status">তর্জনী দিয়ে কারসর | চিমটি (Pinch) দিয়ে ক্লিক</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Developer Modal -->
  <div id="devModal" class="modal">
    <div class="modal-content cyber-card">
      <h2 class="cyber-title">⚡ CYBER HUD DEVELOPER ⚡</h2>
      <div class="dev-details">
        <p><strong>ডেভলপার:</strong> Mohammad Billal Hossain (Shakil)</p>
        <p><strong>ইঞ্জিন:</strong> AI Gesture Motion Engine 4.0</p>
        <p><strong>স্ট্যাটাস:</strong> High Speed & Zero Auto-Click</p>
      </div>
      <button class="cyber-btn close-btn" onclick="hideDevInfo()">[ X ] বন্ধ করুন</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
