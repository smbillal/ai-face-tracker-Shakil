<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber UI - Face & Hand Tracker</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="cyber-container">
    <!-- TOP BOX: Cyber Screen, Tools & Virtual Keyboard -->
    <div class="top-box cyber-card">
      <div class="cyber-tools">
        <span class="tool-title">⚡ CYBER TOOLS</span>
        <button class="cyber-btn" onclick="takeScreenshot()">📸 স্ক্রিনশট (৩ আঙুল)</button>
        <button class="cyber-btn" onclick="showDevInfo()">👤 ডেভলপার (মাঝের আঙুল/ভয়েস)</button>
        <span id="voice-status" class="status-tag">🎙️ ভয়েস রেডি</span>
      </div>

      <div class="display-screen">
        <textarea id="cyberInput" placeholder="সাইবার কিবোর্ড দিয়ে এখানে লিখুন..."></textarea>
      </div>

      <!-- Virtual Cyber Keyboard -->
      <div class="cyber-keyboard" id="keyboard">
        <!-- JS দিয়ে কিবোর্ড তৈরি হবে -->
      </div>
    </div>

    <!-- BOTTOM BOX: Camera Feed with Face & Hand Tracking -->
    <div class="bottom-box cyber-card">
      <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div class="tracking-overlay">
          <span>FACE & HAND TRACKING: ACTIVE</span>
          <span id="gesture-detected">গেচার: অপেক্ষারত...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Developer Info Modal -->
  <div id="devModal" class="modal">
    <div class="modal-content cyber-card">
      <h2>⚡ DEVELOPER INFORMATION ⚡</h2>
      <p><strong>ডেভলপার নাম:</strong> Cyber Creator</p>
      <p><strong>ভার্সন:</strong> 2.0 (High Speed Digital Edition)</p>
      <p><strong>টেকনোলজি:</strong> MediaPipe, Web Speech API, HTML5/CSS3/JS</p>
      <p><strong>স্ট্যাটাস:</strong> System Operational</p>
      <button class="cyber-btn close-btn" onclick="hideDevInfo()">বন্ধ করুন</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
