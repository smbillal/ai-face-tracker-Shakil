<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gesture Browser & Face Tracker</title>
  
  <!-- MediaPipe AI Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top: Browser & Keyboard Area */
    .browser-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border-bottom: 2px solid #30363d;
      padding: 8px;
      gap: 6px;
    }

    .url-bar-container {
      display: flex;
      gap: 6px;
    }

    .url-input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #58a6ff;
      font-size: 14px;
      outline: none;
    }

    .btn-go {
      padding: 8px 14px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Virtual Keyboard */
    .virtual-keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      background: #21262d;
      padding: 6px;
      border-radius: 6px;
    }

    .key-btn {
      padding: 6px 9px;
      background: #30363d;
      color: #f0f6fc;
      border: 1px solid #484f58;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      user-select: none;
    }

    .web-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
      border-radius: 6px;
    }

    /* Bottom: Camera & Tracker Area */
    .tracker-container {
      height: 32vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      padding: 4px;
    }

    #status {
      position: absolute;
      top: 6px;
      background: rgba(0,0,0,0.75);
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 11px;
      color: #39d353;
      z-index: 10;
    }

    canvas {
      height: 100%;
      max-width: 100%;
      border: 2px solid #e3b341;
      border-radius: 8px;
      object-fit: contain;
    }

    /* Gesture Hand Cursor */
    #cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      background: rgba(255, 215, 0, 0.85);
      border: 2px solid #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
      transition: background 0.1s, transform 0.1s;
    }

    #cursor.clicking {
      background: #ff0055;
      transform: translate(-50%, -50%) scale(1.4);
    }
  </style>
</head>
<body>

  <!-- Hand Gesture Cursor -->
  <div id="cursor"></div>

  <!-- Top: Virtual Browser & Keyboard -->
  <div class="browser-container">
    <div class="url-bar-container">
      <input type="text" id="urlInput" class="url-input" placeholder="ইশারায় টাইপ করুন..." value="https://www.bing.com">
      <button class="btn-go" onclick="loadUrl()">Go</button>
    </div>

    <!-- Virtual Keyboard -->
    <div class="virtual-keyboard" id="keyboard"></div>

    <!-- Web View Frame -->
    <iframe id="webFrame" class="web-frame" src="https://www.bing.com"></iframe>
  </div>

  <!-- Bottom: Face & Hand AI Tracker -->
  <div class="tracker-container">
    <div id="status">ক্যামেরা ও AI মডেল লোড হচ্ছে...</div>
    <video class="input_video" style="display:none;" autoplay muted playsinline></video>
    <canvas class="output_canvas" width="480" height="360"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
